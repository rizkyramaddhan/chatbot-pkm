<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chatbot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="gc-widget" id="gc-widget">
      <div
        id="gc-panel"
        class="gc-panel gc-hidden"
        role="dialog"
        aria-label="Chatbot"
      >
        <div class="gc-header">
          <div
            style="
              width: 40px;
              height: 40px;
              border-radius: 10px;
              background: linear-gradient(90deg, var(--primary), #6fb3ff);
            "
          ></div>
          <div>
            <div class="gc-title">Chat dengan Kami</div>
            <div class="meta">Bantuan otomatis — cepat & sopan</div>
          </div>
        </div>
        <div class="gc-body" id="gc-body"></div>
        <div class="gc-input">
          <input
            id="gc-input"
            type="text"
            placeholder="Tanyakan sesuatu..."
            aria-label="Pesan"
          />
          <button id="gc-send">Kirim</button>
        </div>
      </div>
      <button id="gc-toggle" class="gc-button" aria-label="Buka chat">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          ></path>
        </svg>
      </button>
    </div>
    <script src="widget.js" defer></script>
  </body>
</html>
